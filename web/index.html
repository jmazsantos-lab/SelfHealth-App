<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF2F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Self">
<title>Self</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --c1:#1D5FB8;--c2:#178A5E;--c3:#2E5FB0;--c4:#1F7FA6;--c5:#F2C230;
  --bg:#EDF2F1;--s1:#FFFFFF;--s2:#F1F6F5;--s3:#DCE7E6;--line:#D6E1E0;
  --tx:#10292F;--mu:#557078;--mu2:#93A9AE;
  --acc:var(--c1);--logo:var(--c1);
  --rec:var(--c2);--nut:color-mix(in srgb,var(--c2) 70%,#7FBF95);--hrv:color-mix(in srgb,var(--c2) 55%,var(--c3));--alc:color-mix(in srgb,var(--c2) 60%,var(--mu));--caf:color-mix(in srgb,var(--c2) 45%,var(--mu));
  --slp:var(--c3);--deep:color-mix(in srgb,var(--c3) 65%,#000);--light:var(--c3);--remc:color-mix(in srgb,var(--c3) 45%,#fff);
  --act:var(--c4);--cf:color-mix(in srgb,var(--c4) 70%,var(--c3));--str:color-mix(in srgb,var(--c4) 60%,var(--mu));
  --pop:var(--c5);--awake:var(--c5);--red:color-mix(in srgb,var(--c5) 60%,#000);
  --sea:#D2E3EA;--land:#F5F8F8;--street:#E1EAEA;
  --shadow:0 1px 3px rgba(16,41,47,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A1416;--s1:#112023;--s2:#16292C;--s3:#21383C;--line:#1E3236;
  --tx:#E6F0EF;--mu:#87A3A6;--mu2:#557074;
  --acc:color-mix(in srgb,var(--c1) 65%,#fff);--logo:var(--c1);
  --rec:color-mix(in srgb,var(--c2) 70%,#fff);--nut:color-mix(in srgb,var(--c2) 55%,#cfeedd);--hrv:color-mix(in srgb,var(--c2) 45%,color-mix(in srgb,var(--c3) 70%,#fff));--alc:color-mix(in srgb,var(--c2) 50%,var(--mu));--caf:color-mix(in srgb,var(--c2) 40%,var(--mu));
  --slp:color-mix(in srgb,var(--c3) 65%,#fff);--deep:color-mix(in srgb,var(--c3) 85%,#fff);--light:color-mix(in srgb,var(--c3) 60%,#fff);--remc:color-mix(in srgb,var(--c3) 35%,#fff);
  --act:color-mix(in srgb,var(--c4) 65%,#fff);--cf:color-mix(in srgb,var(--c4) 55%,var(--c3));--str:color-mix(in srgb,var(--c4) 50%,var(--mu));
  --pop:var(--c5);--awake:var(--c5);--red:var(--c5);
  --sea:#0F2730;--land:#132326;--street:#1B3034;--shadow:none;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Archivo,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;justify-content:center;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.app{width:100%;max-width:440px;min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(100px + env(safe-area-inset-bottom))}
.num{font-stretch:76%;font-weight:640;letter-spacing:-.01em}

/* Splash */
#splash{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;gap:14px;transition:opacity .22s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .vt{transform-box:fill-box;transform-origin:center;opacity:0;animation:vt .32s cubic-bezier(.3,1.5,.5,1) forwards}
#splash .icon{opacity:0;animation:fadein .15s forwards}
#splash .wm{font-size:40px;font-stretch:76%;font-weight:700;letter-spacing:-.01em;opacity:0;transform:translateX(-8px);animation:wm .3s .5s ease forwards}
@keyframes vt{from{opacity:0;transform:scaleX(.15)}to{opacity:1;transform:none}}
@keyframes fadein{to{opacity:1}}
@keyframes wm{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}

/* Header */
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.bl{display:flex;align-items:center;gap:8px}
.bl .wm{font-size:21px;font-stretch:76%;font-weight:700}
.hbtns{display:flex;gap:8px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:11px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--tx)}
.iconbtn .live{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--rec)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--s3);color:var(--tx)}
.ph{margin-bottom:16px}
.date{color:var(--mu);font-size:14px}
h1{font-size:34px;font-stretch:76%;font-weight:700;letter-spacing:-.01em;line-height:1.05;margin-top:2px}

/* Detail top bar */
.tb{display:flex;align-items:center;justify-content:space-between;margin:0 -6px 14px;min-height:38px}
.back{display:flex;align-items:center;gap:2px;font-size:15px;font-weight:500;color:var(--acc);padding:6px}
.tbt{font-size:15px;font-weight:600}

/* Cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero{border-radius:18px;padding:18px 16px 14px}
.ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:8px}
.ct h3{font-size:16px;font-weight:600}
.ct .r{font-size:13px;color:var(--mu);white-space:nowrap}
.sec{font-size:20px;font-stretch:76%;font-weight:700;margin:24px 2px 10px}
.src{font-size:12px;color:var(--mu)}
.muted{color:var(--mu)}.small{font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
[data-open]{cursor:pointer}
.card[data-open],.tile[data-open]{transition:transform .12s}
.card[data-open]:active,.tile[data-open]:active,.it[data-open]:active{transform:scale(.985)}
.chev{color:var(--mu2);display:inline-flex}

/* Score triad */
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sc .l{font-size:13px;color:var(--mu)}
.sc .v{font-size:44px;line-height:1;margin-top:4px}
.sc .v small{font-size:16px;color:var(--mu);font-weight:500;margin-left:1px}
.meter{height:4px;border-radius:2px;background:var(--s3);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:2px;width:0;transition:width 1s cubic-bezier(.3,.7,.2,1)}
.sc .s{font-size:12.5px;margin-top:6px;font-weight:500}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:8px}
.tl-legend span{display:flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.divider{height:1px;background:var(--line);margin:16px -16px 14px}

/* Tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px;box-shadow:var(--shadow);overflow:hidden}
.tl{font-size:13px;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
.tv{font-size:30px;margin-top:4px;line-height:1.05}
.tv small{font-size:13px;color:var(--mu);font-weight:500;margin-left:3px;font-stretch:100%}
.td{font-size:12px;margin-top:2px}
.up{color:var(--rec)}.down{color:var(--red)}.neu{color:var(--mu)}
.stat{background:var(--s2);border-radius:10px;padding:10px}
.stat b{display:block;font-size:20px;font-stretch:76%;font-weight:640}
.stat span{font-size:12px;color:var(--mu);display:block;margin-top:1px}
.s4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.s4 .stat{padding:9px 8px}.s4 .stat b{font-size:17px}.s4 .stat span{font-size:11px}

/* Progress */
.bar{height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px;transition:width 1s cubic-bezier(.3,.7,.2,1)}
.pl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
.pl b{font-weight:600}
.stack>*+*{margin-top:14px}

/* Lists */
.list .it{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0;padding-top:0}
.list .it:last-child{padding-bottom:0}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--s2)}
.it .mid{flex:1;min-width:0}
.it .t1{font-size:15px;font-weight:600}
.it .t2{font-size:13px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .end{text-align:right;font-size:15px;font-weight:600;white-space:nowrap}
.it .end span{display:block;font-size:12px;color:var(--mu);font-weight:400;margin-top:2px}
.flag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;white-space:nowrap}
.flag::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor}

/* Habits */
.hlist{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.hb{display:flex;align-items:center;gap:8px;font-size:14px}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--mu2);display:grid;place-items:center;flex-shrink:0}
.hb.ok .box{background:var(--rec);border-color:var(--rec);color:#fff}
.hb:not(.ok){color:var(--mu)}

/* Segmented / chips */
.seg{display:flex;background:var(--s3);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:7px 0;font-size:13.5px;font-weight:600;border-radius:8px;color:var(--mu)}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:14px;font-weight:500;padding:7px 13px;border-radius:8px;background:var(--s1);border:1px solid var(--line);color:var(--mu)}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

/* Charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--mu2);font-size:9.5px;font-family:Archivo,system-ui,sans-serif}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:ln 1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.br{transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.3,.7,.2,1) both}
.brn{transform-box:fill-box;transform-origin:top;animation:grow .6s cubic-bezier(.3,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.ln,.br,.brn{animation:none;stroke-dashoffset:0}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mu);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}

/* Big */
.big{font-size:56px;line-height:.95}
.big small{font-size:18px;font-weight:500;color:var(--mu);margin-left:4px;font-stretch:100%}

/* Gauge */
.gauge{position:relative;height:8px;border-radius:4px;display:flex;overflow:hidden;gap:2px}
.gauge i{display:block;height:100%}
.gmark{position:absolute;top:-5px;width:3px;height:18px;border-radius:2px;background:var(--tx);box-shadow:0 0 0 2px var(--s1);transform:translateX(-50%)}
.gl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu2);margin-top:8px}

/* Comparison */
.cmp{display:grid;grid-template-columns:96px 1fr 56px;align-items:center;gap:10px;font-size:13px;margin-top:9px}
.cmp b{text-align:right;font-weight:600}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--mu);text-align:right;padding:0 0 8px;font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:8px 0;border-top:1px solid var(--line)}
.tbl tr.best td{font-weight:700}
.tbl .tag{font-size:11px;color:var(--mu);font-weight:400}

/* Diverging factor bars */
.fac{display:grid;grid-template-columns:1fr 120px 44px;gap:10px;align-items:center;font-size:13.5px;padding:9px 0;border-top:1px solid var(--line)}
.fac:first-of-type{border-top:0}
.dv{position:relative;height:8px;background:var(--s3);border-radius:4px}
.dv::after{content:"";position:absolute;left:50%;top:-3px;width:1px;height:14px;background:var(--mu2)}
.dv i{position:absolute;top:0;height:100%;border-radius:4px}

/* Buttons */
.add{width:100%;margin-top:14px;padding:12px;border-radius:10px;border:1px dashed var(--mu2);color:var(--mu);font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.more{width:100%;margin-top:12px;padding:10px;border-radius:10px;background:var(--s2);color:var(--acc);font-size:14px;font-weight:600}

.cause{font-size:12px;color:var(--mu);margin-top:2px}
.it .t2.w{white-space:normal;line-height:1.4}
.ins{font-size:16px;line-height:1.5}
.ins-s{font-size:14px;line-height:1.5}
.rel{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.rel:first-child{border-top:0;padding-top:0}.rel:last-child{padding-bottom:0}
.rel .t1{font-size:15px;font-weight:600}.rel b{font-size:15px;white-space:nowrap}
.rs{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--mu)}
.rs .chev{margin-left:auto}
.str{width:64px;height:4px;border-radius:2px;background:var(--s3);overflow:hidden;flex-shrink:0}.str i{display:block;height:100%}
.mx{display:grid;grid-template-columns:70px repeat(7,1fr);gap:3px;align-items:center}
.mxh{text-align:center;color:var(--mu);font-size:10px;line-height:1.1;padding-bottom:4px;align-self:end}
.mxr{font-size:12px;line-height:1.15}
.mxc{height:36px;border-radius:6px;font-size:10.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.mxc.na{color:var(--mu2);background:var(--s2)}
.lead{font-size:15px;line-height:1.5;color:var(--mu);margin-top:-6px}
.mod{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;display:grid;grid-template-columns:1fr 132px;gap:14px;align-items:center;transition:transform .12s}
.mod:active{transform:scale(.99)}
.mh{display:flex;align-items:center;gap:8px}
.mi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.mt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{font-size:32px;line-height:1;margin-top:8px}
.mv small{font-size:13px;color:var(--mu);font-weight:500;margin-left:3px;font-stretch:100%}
.ms{font-size:12.5px;margin-top:6px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms.up{color:var(--rec)}.ms.down{color:var(--red)}
.mc svg{display:block;width:100%;height:auto;overflow:visible}
.mc text{fill:var(--mu2);font-size:9px;font-family:Archivo,system-ui,sans-serif}
.ebtn{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--acc);padding:7px 12px;border-radius:99px;background:color-mix(in srgb,var(--acc) 10%,transparent)}
.elist{display:flex;flex-direction:column;gap:8px}
.erow{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;position:relative}
.erow.drag{box-shadow:0 12px 30px rgba(10,30,35,.2);z-index:5}
.handle{color:var(--mu2);touch-action:none;cursor:grab;padding:4px;display:grid}
.en{flex:1;font-size:15px;font-weight:500}.es{display:block;font-size:12px;color:var(--mu);font-weight:400;margin-top:1px}
.eb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--mu);flex-shrink:0}
.eb.del{color:var(--red)}.eb.add2{background:var(--rec);color:#fff}
/* Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{color:var(--mu2);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;flex:1;padding:6px 0 2px;position:relative}
.nav button.on{color:var(--tx)}
.nav button.on::before{content:"";position:absolute;top:-7px;width:22px;height:2px;border-radius:2px;background:var(--acc)}

/* Sheet & toast */
.ov{position:fixed;inset:0;background:rgba(5,10,18,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:440px;background:var(--s1);border-radius:20px 20px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:51;max-height:86vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:0 auto 14px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.22s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Añadidos de la app real */
.banner{font-size:12.5px;color:var(--mu);background:color-mix(in srgb,var(--pop) 18%,var(--s1));border-radius:10px;padding:8px 12px;margin:-6px 0 14px}
.empty{display:grid;place-items:center;text-align:center;color:var(--mu);font-size:13px;background:var(--s2);border-radius:10px;padding:0 12px}
.lmap{height:240px;border-radius:10px;overflow:hidden;background:var(--land);z-index:0}
.leaflet-container{font-family:Archivo,system-ui,sans-serif}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--mu);margin-bottom:5px}
.fld input,.fld select{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--acc)}
.fld.chk{display:flex;align-items:center;gap:10px}.fld.chk input{width:20px;height:20px}.fld.chk span{margin:0;color:var(--tx);font-size:15px}
.primary{width:100%;padding:14px;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:600;margin-top:6px}
.linkbtn{width:100%;padding:12px;color:var(--acc);font-size:14px;font-weight:600;margin-top:6px}
.login{max-width:380px;margin:12vh auto 0}
.lbrand{display:flex;align-items:center;gap:12px}.lbrand .wm{font-size:34px;font-stretch:76%;font-weight:700}
.err{color:var(--red);font-size:13.5px;min-height:18px;margin-bottom:4px}
.cpick{width:40px;height:34px;border:0;background:none;padding:0;cursor:pointer}
</style>
</head>
<body>
<div id="splash"></div>
<main class="app" id="main"></main>
<nav class="nav" id="nav"></nav>
